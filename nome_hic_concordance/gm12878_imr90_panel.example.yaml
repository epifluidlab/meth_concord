# Example pair-panel config: GM12878 + IMR90 validation panel
# ------------------------------------------------------------
# Bidirectional TF panel:
#   B-lymphoid TFs (SPI1/PU.1, EBF1, IRF4) expected to drive GM12878-biased coordination
#   Fibroblast TFs (TEAD1, SRF, AP1/JUN, AP1/FOS) expected to drive IMR90-biased coordination
#   CTCF, RAD21 architectural (both cell types)
#   NRF1, SP1 housekeeping (falsification controls)
#
# JASPAR matrix IDs are looked up live from https://jaspar.genereg.net/api/v1/matrix/
# and cached in --jaspar-cache. Update IDs if you want a different version.

anchor_size: 5000

distance_bands:
  short: [100000, 500000]
  mid:   [500000, 2000000]
  long:  [2000000, 5000000]

# Run only on autosomes by default. Override here if you want chrX too.
chromosomes:
  - chr1
  - chr2
  - chr3
  - chr4
  - chr5
  - chr6
  - chr7
  - chr8
  - chr9
  - chr10
  - chr11
  - chr12
  - chr13
  - chr14
  - chr15
  - chr16
  - chr17
  - chr18
  - chr19
  - chr20
  - chr21
  - chr22

random_seed: 42

include_co_folded: true
target_co_folded_per_band: 3000

include_random_matched: true
target_random_per_band: 3000

tf_categories:
  # ---------------- B-lymphoid lineage (GM12878-biased) ----------------
  - category: tf_anchored_SPI1
    jaspar_ids: ["MA0080.5"]
    chip_bed: "/data/encode/GM12878/ENCFF000XXX_SPI1.bed"  # ENCODE GM12878 PU.1 ChIP
    target_pairs_per_band: 5000

  - category: tf_anchored_EBF1
    jaspar_ids: ["MA0154.4"]
    chip_bed: "/data/encode/GM12878/ENCFF000YYY_EBF1.bed"
    target_pairs_per_band: 5000

  - category: tf_anchored_IRF4
    jaspar_ids: ["MA1419.1"]
    chip_bed: "/data/encode/GM12878/ENCFF000ZZZ_IRF4.bed"
    target_pairs_per_band: 5000

  # ---------------- Fibroblast lineage (IMR90-biased) ----------------
  - category: tf_anchored_TEAD1
    jaspar_ids: ["MA0090.3"]
    chip_bed: "/data/encode/IMR90/ENCFF000AAA_TEAD1.bed"
    target_pairs_per_band: 5000

  - category: tf_anchored_SRF
    jaspar_ids: ["MA0083.3"]
    chip_bed: "/data/encode/IMR90/ENCFF000BBB_SRF.bed"
    target_pairs_per_band: 5000

  - category: tf_anchored_AP1
    jaspar_ids: ["MA0099.3", "MA0488.1"]  # JUN::FOS heterodimer + JUN alone
    chip_bed: "/data/encode/IMR90/ENCFF000CCC_JUN.bed"
    target_pairs_per_band: 5000

  # ---------------- Architectural (both) ----------------
  - category: tf_anchored_CTCF
    jaspar_ids: ["MA0139.2"]
    chip_bed: null  # use motif scan only; intersect with merged ChIP if available
    target_pairs_per_band: 5000

  # ---------------- Housekeeping (falsification controls) ----------------
  - category: tf_anchored_NRF1
    jaspar_ids: ["MA0506.1"]
    chip_bed: null
    target_pairs_per_band: 5000

  - category: tf_anchored_SP1
    jaspar_ids: ["MA0079.5"]
    chip_bed: null
    target_pairs_per_band: 5000
