[build-system]
requires = ["setuptools>=61", "wheel", "pybind11>=2.10", "pysam>=0.21"]
build-backend = "setuptools.build_meta"

[project]
name = "nome-hic-concordance"
version = "1.0.0"
description = "NOMe-HiC Long-Range Chromatin Accessibility Concordance Pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "meth_concord"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "pysam>=0.21",
    "py2bit>=0.3",
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pybind11>=2.10",
    # The suite is dominated by end-to-end tests that each launch a
    # subprocess, so it parallelises almost linearly: `pytest -n auto` runs
    # in about a quarter of the wall-clock on a normal machine.
    "pytest-xdist>=3.0",
]
# Optional batch-correction backends.  Only required if you set
# --batch-correction combat (combat) or --batch-correction harmony.
batch-combat = [
    "combat>=0.3.3",
]
batch-harmony = [
    "harmonypy>=0.0.9",
]
# Optional bigWig reading/writing.  Only required for --signal-track /
# --derive-lad-bed (scripts/marker_bin_enrichment.py, bin_set_signal_summary.py,
# fetch_4dn_damid.py) and bigWig output from scripts/concordance_bigwig.py;
# every one of those falls back to a bedGraph or a clear message without it.
bigwig = [
    "pyBigWig>=0.3.18",
]
# Convenience: both batch backends at once.
batch = [
    "combat>=0.3.3",
    "harmonypy>=0.0.9",
]

[project.scripts]
nome_hic_concordance = "nome_hic_concordance.cli:main"
nome_hic_pair_concordance = "nome_hic_concordance.pair_concordance.cli:main"
nome_hic_compare = "nome_hic_concordance.comparison_cli:main"
nome_hic_compartments = "nome_hic_concordance.compartments_cli:main"

[tool.setuptools.packages.find]
include = ["nome_hic_concordance*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
# Run in parallel by default.  The suite is ~1,000 tests of which 49 launch a
# subprocess, each paying ~1.5 s of interpreter start plus numpy/pandas/scipy/
# sklearn imports before doing anything; there is no hot spot to optimise --
# the slowest twelve are 139 s of 423 s -- so the cost is spread across
# independent, startup-bound work, which is the shape that parallelises.
# Measured on 8 cores: 423 s -> 136 s.
#
# Safe as an unconditional addopts because pytest itself is only in the [dev]
# extra, so anyone able to run the suite has installed pytest-xdist with it.
# Debug a single test serially with `-n 0`.  NOT `-p no:xdist`: that
# disables the plugin while addopts still passes -n, and pytest then exits on
# an unrecognised argument.
addopts = "-n auto"
testpaths = ["tests"]
