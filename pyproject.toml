[build-system]
requires = ["setuptools>=61", "wheel", "pybind11>=2.10", "pysam>=0.21"]
build-backend = "setuptools.build_meta"

[project]
name = "nome-hic-concordance"
version = "1.0.0"
description = "NOMe-HiC Long-Range Chromatin Accessibility Concordance Pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "meth_concord"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "pysam>=0.21",
    "py2bit>=0.3",
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pybind11>=2.10",
]

[project.scripts]
nome_hic_concordance = "nome_hic_concordance.cli:main"

[tool.setuptools.packages.find]
include = ["nome_hic_concordance*"]
exclude = ["tests*"]
